# SQLite replication. Litestream streams the WAL to a bucket, so losing the
# server means losing seconds of data rather than a day.
dbs:
  - path: /data/korepetycje.db
    replicas:
      - type: s3
        # Backblaze B2 via the S3-compatible API. Swap in your bucket and region.
        bucket: korepetycje-backup
        path: db
        endpoint: s3.eu-central-003.backblazeb2.com
        region: eu-central-003
        # How often accumulated WAL changes are shipped to the bucket. The
        # default (1s) only multiplies small objects in B2; hourly batches
        # are a deliberate choice: a server crash costs at most the last
        # hour of edits. Changes are kept locally in the meantime.
        sync-interval: 1h
        # How much history to keep. 336h = 14 days: snapshots and WAL both scale
        # with it, and at 30 days the replica was 7.6 GB of the free 10 GB.
        retention: 336h
        snapshot-interval: 24h
