services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/data
    expose:
      - "8000"
    # No host port: the backend is reachable only through Caddy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - edge
    environment:
      DOMAIN: ${DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates: MUST survive a restart, otherwise
      - caddy-config:/config   # Let's Encrypt will rate-limit the reissue requests
      - caddy-logs:/var/log/caddy

  # Continuous SQLite replication to Backblaze B2 / S3.
  # Restores to any point in time, not just to the latest snapshot.
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - db-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${B2_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${B2_APP_KEY}
    command: replicate
  
volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
networks:
  edge:
    external: true