[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# URL bazy bierze się z DATABASE_URL w alembic/env.py — tu celowo pusto,
# żeby nie trzymać poświadczeń produkcyjnych w pliku wersjonowanym.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
